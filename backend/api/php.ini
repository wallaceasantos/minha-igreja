; Configuração PHP para API
; Força PHP a executar e mostrar erros

; Exibir erros
display_errors = On
error_reporting = E_ALL

; Configurações de upload
upload_max_filesize = 10M
post_max_size = 10M
max_execution_time = 300
max_input_time = 300
memory_limit = 256M

; Timezone
date.timezone = America/Sao_Paulo

; Charset
default_charset = "UTF-8"

; Sessões
session.gc_maxlifetime = 3600

; Segurança
expose_php = Off
