; .user.ini - Configurações PHP para pasta
; /public_html/plataforma/.user.ini

; Exibir erros
display_errors = On
error_reporting = E_ALL

; Handler PHP
engine = On
short_open_tag = Off

; Timezone
date.timezone = America/Sao_Paulo

; Upload
upload_max_filesize = 10M
post_max_size = 10M
max_execution_time = 300

; Memory
memory_limit = 256M
