<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerar Ícones PWA - MinhaIgreja</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 800px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
        }
        h1 {
            color: #1f2937;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }
        p {
            color: #6b7280;
            text-align: center;
            margin-bottom: 30px;
        }
        .preview {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .icon-preview {
            text-align: center;
        }
        .icon-preview img {
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .icon-preview span {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            color: #6b7280;
        }
        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover {
            background: #4338ca;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.3);
        }
        button.secondary {
            background: #e5e7eb;
            color: #374151;
        }
        button.secondary:hover {
            background: #d1d5db;
        }
        .status {
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
        }
        .status.success {
            background: #d1fae5;
            color: #065f46;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }
        .icons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 30px;
            padding: 20px;
            background: #f9fafb;
            border-radius: 12px;
        }
        .icon-item {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            border: 2px solid #e5e7eb;
        }
        .icon-item img {
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .icon-item span {
            font-size: 12px;
            color: #6b7280;
            font-weight: 500;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Gerador de Ícones PWA</h1>
        <p>Esta ferramenta vai gerar todos os ícones necessários para o PWA funcionar no celular do pastor.</p>
        
        <div class="preview">
            <div class="icon-preview">
                <img id="preview72" width="72" height="72" alt="Preview 72px">
                <span>72x72</span>
            </div>
            <div class="icon-preview">
                <img id="preview192" width="96" height="96" alt="Preview 192px">
                <span>192x192</span>
            </div>
            <div class="icon-preview">
                <img id="preview512" width="128" height="128" alt="Preview 512px">
                <span>512x512</span>
            </div>
        </div>

        <div class="actions">
            <button onclick="gerarTodos()" id="btnGerar">
                📦 Gerar Todos os Ícones
            </button>
            <button onclick="baixarTodos()" class="secondary hidden" id="btnBaixar">
                💾 Baixar Todos (ZIP)
            </button>
        </div>

        <div id="status" class="status hidden"></div>

        <div id="iconsContainer" class="icons-grid hidden"></div>
    </div>

    <script>
        const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
        const generatedIcons = [];

        // SVG do ícone
        const svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <rect width="512" height="512" rx="80" fill="#4f46e5"/>
            <path d="M256 120 L120 240 L160 240 L160 360 L352 360 L352 240 L392 240 Z" fill="white"/>
            <rect x="220" y="280" width="72" height="80" fill="#4f46e5"/>
        </svg>`;

        // Carregar previews
        window.onload = function() {
            const svgBlob = new Blob([svgContent], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(svgBlob);
            
            document.getElementById('preview72').src = url;
            document.getElementById('preview192').src = url;
            document.getElementById('preview512').src = url;
        };

        async function gerarTodos() {
            const btnGerar = document.getElementById('btnGerar');
            const btnBaixar = document.getElementById('btnBaixar');
            const status = document.getElementById('status');
            const container = document.getElementById('iconsContainer');
            
            btnGerar.disabled = true;
            btnGerar.textContent = '🎨 Gerando...';
            status.className = 'status';
            status.textContent = 'Gerando ícones, aguarde...';
            status.classList.remove('hidden');
            container.innerHTML = '';
            generatedIcons.length = 0;

            try {
                for (const size of sizes) {
                    const canvas = document.createElement('canvas');
                    canvas.width = size;
                    canvas.height = size;
                    const ctx = canvas.getContext('2d');
                    
                    // Criar imagem do SVG
                    const img = new Image();
                    const svgBlob = new Blob([svgContent], {type: 'image/svg+xml'});
                    const url = URL.createObjectURL(svgBlob);
                    
                    await new Promise((resolve, reject) => {
                        img.onload = resolve;
                        img.onerror = reject;
                        img.src = url;
                    });
                    
                    ctx.drawImage(img, 0, 0, size, size);
                    URL.revokeObjectURL(url);
                    
                    // Converter para PNG
                    const pngUrl = canvas.toDataURL('image/png');
                    generatedIcons.push({ size, url: pngUrl });
                    
                    // Adicionar ao grid
                    const item = document.createElement('div');
                    item.className = 'icon-item';
                    item.innerHTML = `
                        <img src="${pngUrl}" width="${Math.min(size, 80)}" height="${Math.min(size, 80)}">
                        <br>
                        <span>icon-${size}x${size}.png</span>
                        <br>
                        <a href="${pngUrl}" download="icon-${size}x${size}.png" 
                           style="color: #4f46e5; font-size: 11px; text-decoration: none;">
                           📥 Baixar
                        </a>
                    `;
                    container.appendChild(item);
                }
                
                container.classList.remove('hidden');
                btnBaixar.classList.remove('hidden');
                status.className = 'status success';
                status.innerHTML = '✅ Ícones gerados com sucesso!<br><small>Clique em "Baixar Todos" ou em cada ícone individualmente.</small>';
                
            } catch (error) {
                status.className = 'status error';
                status.innerHTML = '❌ Erro ao gerar ícones: ' + error.message;
            }
            
            btnGerar.disabled = false;
            btnGerar.textContent = '📦 Gerar Todos os Ícones';
        }

        async function baixarTodos() {
            // Baixar cada arquivo individualmente
            for (const icon of generatedIcons) {
                const link = document.createElement('a');
                link.href = icon.url;
                link.download = `icon-${icon.size}x${icon.size}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                // Pequena pausa entre downloads
                await new Promise(resolve => setTimeout(resolve, 100));
            }
        }
    </script>
</body>
</html>
